# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: Congested Wi-Fi
description: RTT ≈ 30 ms with high jitter, 1.5 % burst loss, 20 Mbit/s
translations:
  pl:
    name: Wi-Fi zatłoczone
    description: RTT ≈ 30 ms z dużym jitterem, straty seriami 1,5 %, 20 Mbit/s
a_to_b:
  delay_ms: 15
  jitter_ms: 10
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1.5
  loss_burst_len: 3
  rate_kbit: 20000
b_to_a:
  delay_ms: 15
  jitter_ms: 10
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1.5
  loss_burst_len: 3
  rate_kbit: 20000
