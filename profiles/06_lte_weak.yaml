# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: LTE weak coverage / congested cell
description: RTT ≈ 90 ms, high jitter, 1 % burst loss, 3/0.5 Mbit/s
translations:
  pl:
    name: LTE słaby zasięg / przeciążona komórka
    description: RTT ≈ 90 ms, duży jitter, straty seriami 1 %, 3/0,5 Mbit/s
a_to_b:
  delay_ms: 45
  jitter_ms: 30
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1
  loss_burst_len: 4
  rate_kbit: 500
b_to_a:
  delay_ms: 45
  jitter_ms: 30
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1
  loss_burst_len: 4
  rate_kbit: 3000
