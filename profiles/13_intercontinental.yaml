# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: Intercontinental link
description: RTT ≈ 180 ms (e.g. Europe – USA / Asia), 0.2 % loss, no bandwidth limit
translations:
  pl:
    name: Łącze międzykontynentalne
    description: RTT ≈ 180 ms (np. Europa – USA / Azja), straty 0,2 %, bez limitu
      przepustowości
a_to_b:
  delay_ms: 90
  jitter_ms: 3
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.2
b_to_a:
  delay_ms: 90
  jitter_ms: 3
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.2
