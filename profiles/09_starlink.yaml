# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: Starlink (LEO satellites)
description: RTT ≈ 40 ms, 100/12 Mbit/s, 1 % burst loss (satellite handovers); periodic
  latency spikes every 15 s are not modelled
translations:
  pl:
    name: Starlink (satelity LEO)
    description: RTT ≈ 40 ms, 100/12 Mbit/s, straty seriami 1 % (przełączenia satelitów);
      okresowe skoki opóźnienia co 15 s nie są modelowane
a_to_b:
  delay_ms: 20
  jitter_ms: 8
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1
  loss_burst_len: 10
  rate_kbit: 12000
b_to_a:
  delay_ms: 20
  jitter_ms: 8
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 1
  loss_burst_len: 10
  rate_kbit: 100000
