# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: Narrowband radio link
description: RTT ≈ 300 ms, 5 % burst loss, 64 kbit/s
translations:
  pl:
    name: Łącze radiowe wąskopasmowe
    description: RTT ≈ 300 ms, straty seriami 5 %, 64 kbit/s
a_to_b:
  delay_ms: 150
  jitter_ms: 50
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 5
  loss_burst_len: 8
  rate_kbit: 64
b_to_a:
  delay_ms: 150
  jitter_ms: 50
  distribution: normal
  keep_order: true
  loss_mode: burst
  loss_pct: 5
  loss_burst_len: 8
  rate_kbit: 64
