# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: Congested link
description: RTT ≈ 100 ms, high jitter, 3 % loss, 512 kbit/s
translations:
  pl:
    name: Przeciążone łącze
    description: RTT ≈ 100 ms, duży jitter, straty 3 %, 512 kbit/s
a_to_b:
  delay_ms: 50
  jitter_ms: 40
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 3
  rate_kbit: 512
b_to_a:
  delay_ms: 50
  jitter_ms: 40
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 3
  rate_kbit: 512
