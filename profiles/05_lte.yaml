# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: LTE good coverage
description: RTT ≈ 50 ms, 30/8 Mbit/s, 0.1 % loss (radio retransmissions hide most
  losses)
translations:
  pl:
    name: LTE dobry zasięg
    description: RTT ≈ 50 ms, 30/8 Mbit/s, straty 0,1 % (retransmisje radiowe ukrywają
      większość strat)
a_to_b:
  delay_ms: 25
  jitter_ms: 7.5
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.1
  rate_kbit: 8000
b_to_a:
  delay_ms: 25
  jitter_ms: 7.5
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.1
  rate_kbit: 30000
