# Default profile, generated by scripts/generate_profiles.py (edit there).
# A -> B = upload, B -> A = download. Delay and jitter per direction (RTT/2).
name: VPN / tunnel (MTU 1400)
description: RTT ≈ 40 ms, packets larger than 1400 B dropped (fragmentation / PMTU
  test)
translations:
  pl:
    name: VPN / tunel (MTU 1400)
    description: RTT ≈ 40 ms, pakiety większe niż 1400 B odrzucane (test fragmentacji
      / PMTU)
a_to_b:
  delay_ms: 20
  jitter_ms: 3
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.1
  mtu: 1400
b_to_a:
  delay_ms: 20
  jitter_ms: 3
  distribution: normal
  keep_order: true
  loss_mode: random
  loss_pct: 0.1
  mtu: 1400
