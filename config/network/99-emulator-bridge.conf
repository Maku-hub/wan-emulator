# /etc/sysctl.d/99-emulator-bridge.conf
# Bridged traffic must not go through the host's iptables/nftables.
# Only relevant when br_netfilter is loaded; the leading "-" ignores missing keys.
-net.bridge.bridge-nf-call-iptables = 0
-net.bridge.bridge-nf-call-ip6tables = 0
-net.bridge.bridge-nf-call-arptables = 0
