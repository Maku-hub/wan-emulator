name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: JavaScript syntax and translations
        run: |
          node --check app/wanemu/static/app.js
          node --check app/wanemu/static/i18n.js
          node tests/check_i18n.js
      - name: Default profiles are up to date
        run: |
          python scripts/generate_profiles.py
          git diff --exit-code -- profiles/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  integration:
    # Real netem on a virtual network (network namespaces), needs root.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Install tools and the netem module
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y iperf3 ethtool
          # sch_netem ships in the base modules on some runner kernels and in
          # linux-modules-extra on others; that package does not exist for every kernel.
          if ! sudo modprobe sch_netem 2>/dev/null; then
            sudo -E apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi
          sudo tc qdisc add dev lo root netem delay 1ms
          sudo tc qdisc del dev lo root
          echo "netem available on $(uname -r)"
      - name: netns self-test
        run: sudo "$(which python)" -B tests/netns_selftest.py
